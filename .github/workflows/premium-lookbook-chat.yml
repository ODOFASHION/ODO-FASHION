name: ODO Premium Lookbook + Customer Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ODO upgrades
        run: |
          set -e
          if ! grep -q 'ODO_PREMIUM_LOOKBOOK_V2' style.css; then
            cat .github/odo-premium.css >> style.css
          fi
          if ! grep -q 'ODO_AI_ASSISTANT_V1' script.js; then
            cat .github/odo-assistant.js >> script.js
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          if git diff --cached --quiet; then
            echo 'ODO upgrades already applied'
            exit 0
          fi
          git commit -m 'Upgrade Lookbook and add ODO customer assistant'
          git push
