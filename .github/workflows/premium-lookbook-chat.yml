name: ODO Premium Lookbook + Customer Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ODO upgrades
        shell: bash
        run: |
          set -e
          if ! grep -q 'ODO_PREMIUM_LOOKBOOK_V2' style.css; then
            cat .github/odo-premium.css >> style.css
          fi
          if ! grep -q 'ODO_AI_ASSISTANT_V1' script.js; then
            cat .github/odo-assistant.js >> script.js
          fi
          if ! grep -q 'google-login.js' index.html; then
            sed -i 's#</body>#<script src="google-login.js"></script></body>#' index.html
          fi
          if ! grep -q '.github/seo-head.html' index.html; then
            python - <<'PY'
            from pathlib import Path
            page = Path('index.html')
            seo = Path('.github/seo-head.html').read_text(encoding='utf-8')
            text = page.read_text(encoding='utf-8')
            if seo not in text:
                text = text.replace('</head>', seo + '</head>', 1)
                page.write_text(text, encoding='utf-8')
            PY
          fi
          rm -f .github/odo-premium.css .github/odo-assistant.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
