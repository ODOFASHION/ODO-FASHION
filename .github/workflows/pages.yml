name: Deploy ODO Fashion to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add second ODO WhatsApp customer-care number
        shell: bash
        run: |
          set -e
          if ! grep -q 'ODO_SUPPORT_2NUM_V1' script.js; then
            cat .github/odo-support.js >> script.js
          fi
      - name: Add website-only order confirmation flow
        shell: bash
        run: |
          set -e
          if ! grep -q 'order-fix.js' index.html; then
            sed -i 's#<script type="module" src="auth.js"></script>#<script type="module" src="auth.js"></script><script src="order-fix.js"></script>#' index.html
          fi
      - name: Add Google sign-in button
        shell: bash
        run: |
          set -e
          if ! grep -q 'google-login.js' index.html; then
            sed -i 's#<script src="order-fix.js"></script>#<script src="order-fix.js"></script><script src="google-login.js"></script>#' index.html
          fi
      - name: Add legal policy links
        shell: bash
        run: |
          set -e
          if ! grep -q 'policies.js' index.html; then
            sed -i 's#</body>#<script src="policies.js"></script></body>#' index.html
          fi
      - name: Add cart back-to-shop control
        shell: bash
        run: |
          set -e
          if ! grep -q 'cart-back.js' index.html; then
            sed -i 's#</body>#<script src="cart-back.js"></script></body>#' index.html
          fi
      - name: Add ODO visitor tracking
        shell: bash
        run: |
          set -e
          if ! grep -q 'visit-tracker.js' index.html; then
            sed -i 's#</body>#<script type="module" src="visit-tracker.js"></script></body>#' index.html
          fi
      - name: Add visitor analytics to admin dashboard
        shell: bash
        run: |
          set -e
          if ! grep -q 'admin-visits.js' admin.html; then
            sed -i 's#</body>#<script type="module" src="admin-visits.js"></script></body>#' admin.html
          fi
      - name: Add ODOFASHION SEO metadata
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          seo = Path('.github/seo-head.html').read_text(encoding='utf-8')
          text = page.read_text(encoding='utf-8')
          if seo not in text:
              text = text.replace('</head>', seo + '</head>', 1)
              page.write_text(text, encoding='utf-8')
          PY
      - name: Clean shared tracking parameters from visible URL
        shell: bash
        run: |
          set -e
          if ! grep -q 'clean-url.js' index.html; then
            sed -i 's#</body>#<script src="clean-url.js"></script></body>#' index.html
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
