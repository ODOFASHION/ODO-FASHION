name: Deploy ODO Fashion to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize ODO catalog scripts
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          for src in ['dynamic-products.js','product-engagement.js','odo-catalog-loader.js','dipesh-profile.js','order-tracking.js','product-reviews.js','return-exchange.js','stock-checkout-fix.js','odo-premium-v3.js','odo-contact-enhance.js','odo-ui-v4.js','odo-ui-v5.js']:
              text=re.sub(r'<script[^>]+src=["\']'+re.escape(src)+r'(?:\?[^"\']*)?[^>]*></script>', '', text, flags=re.I)
          for src in ['product-engagement.js?v=9','odo-catalog-loader.js?v=1','dipesh-profile.js?v=1','order-tracking.js?v=1','product-reviews.js?v=1','return-exchange.js?v=1']:
              tag=f'<script type="module" src="{src}"></script>'
              if tag not in text:
                  text=text.replace('</body>',tag+'</body>')
          text=re.sub(r'<script[^>]+src=["\']auth\.js(?:\?[^"\']*)?["\'][^>]*></script>', '<script type="module" src="stock-checkout-fix.js?v=1"></script><script type="module" src="live-commerce-fix.js?v=1"></script><script type="module" src="auth.js"></script>', text, count=1, flags=re.I)
          if 'stock-checkout-fix.js?v=1' not in text:
              text=text.replace('</body>','<script type="module" src="stock-checkout-fix.js?v=1"></script></body>')
          if 'live-commerce-fix.js?v=1' not in text:
              text=text.replace('</body>','<script type="module" src="live-commerce-fix.js?v=1"></script></body>')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Add ODO Journal public display
        shell: bash
        run: |
          set -e
          if ! grep -q 'journal.js' index.html; then sed -i 's#</body>#<script type="module" src="journal.js"></script></body>#' index.html; fi
      - name: Add ODO Journal admin panel
        shell: bash
        run: |
          set -e
          if ! grep -q 'journal-admin.js' admin.html; then sed -i 's#</body>#<script type="module" src="journal-admin.js"></script></body>#' admin.html; fi
      - name: Add ODO customer messaging
        shell: bash
        run: |
          set -e
          if ! grep -q 'chat.js' index.html; then sed -i 's#</body>#<script type="module" src="chat.js"></script></body>#' index.html; fi
          if ! grep -q 'admin-chat.js' admin.html; then sed -i 's#</body>#<script type="module" src="admin-chat.js"></script></body>#' admin.html; fi
      - name: Add unified ODO chat and AI assistant UX
        shell: bash
        run: |
          set -e
          if ! grep -q 'customer-chat-ai.js' index.html; then sed -i 's#</body>#<script type="module" src="customer-chat-ai.js"></script></body>#' index.html; fi
      - name: Add second ODO WhatsApp customer-care number
        shell: bash
        run: |
          set -e
          if ! grep -q 'ODO_SUPPORT_2NUM_V1' script.js; then cat .github/odo-support.js >> script.js; fi
      - name: Add visitor analytics admin panel
        shell: bash
        run: |
          set -e
          if ! grep -q 'admin-visits.js' admin.html; then sed -i 's#</body>#<script type="module" src="admin-visits.js"></script></body>#' admin.html; fi
      - name: Add ODO marketing dashboard to admin
        shell: bash
        run: |
          set -e
          if ! grep -q 'admin-marketing.js' admin.html; then sed -i 's#</body>#<script type="module" src="admin-marketing.js"></script></body>#' admin.html; fi
      - name: Add ODO product reviews
        shell: bash
        run: |
          set -e
          if ! grep -q 'product-reviews.js' index.html; then sed -i 's#</body>#<script type="module" src="product-reviews.js?v=1"></script></body>#' index.html; fi
          if ! grep -q 'admin-reviews.js' admin.html; then sed -i 's#</body>#<script type="module" src="admin-reviews.js"></script></body>#' admin.html; fi
      - name: Add ODO returns and exchanges
        shell: bash
        run: |
          set -e
          if ! grep -q 'return-exchange.js' index.html; then sed -i 's#</body>#<script type="module" src="return-exchange.js?v=1"></script></body>#' index.html; fi
          if ! grep -q 'admin-returns.js' admin.html; then sed -i 's#</body>#<script type="module" src="admin-returns.js"></script></body>#' admin.html; fi
      - name: Add website-only order confirmation flow
        shell: bash
        run: |
          set -e
          if ! grep -q 'order-fix.js' index.html; then sed -i 's#<script type="module" src="auth.js"></script>#<script type="module" src="auth.js"></script><script src="order-fix.js"></script>#' index.html; fi
      - name: Add Google sign-in button
        shell: bash
        run: |
          set -e
          if ! grep -q 'google-login.js' index.html; then sed -i 's#<script src="order-fix.js"></script>#<script src="order-fix.js"></script><script src="google-login.js"></script>#' index.html; fi
      - name: Add legal policy links
        shell: bash
        run: |
          set -e
          if ! grep -q 'policies.js' index.html; then sed -i 's#</body>#<script src="policies.js"></script></body>#' index.html; fi
      - name: Add cart back-to-shop control
        shell: bash
        run: |
          set -e
          if ! grep -q 'cart-back.js' index.html; then sed -i 's#</body>#<script src="cart-back.js"></script></body>#' index.html; fi
      - name: Add ODO visitor tracking
        shell: bash
        run: |
          set -e
          if ! grep -q 'visit-tracker.js' index.html; then sed -i 's#</body>#<script type="module" src="visit-tracker.js"></script></body>#' index.html; fi
      - name: Add ODOFASHION SEO metadata
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          page=Path('index.html'); seo=Path('.github/seo-head.html').read_text(encoding='utf-8'); text=page.read_text(encoding='utf-8')
          if seo not in text: page.write_text(text.replace('</head>',seo+'</head>',1),encoding='utf-8')
          PY
      - name: Clean shared tracking parameters from visible URL
        shell: bash
        run: |
          set -e
          if ! grep -q 'clean-url.js' index.html; then sed -i 's#</body>#<script src="clean-url.js"></script></body>#' index.html; fi
      - name: Load definitive ODO controls UI
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="odo-ui-v5.css?v=5">'
          if css not in text:
              text=text.replace('</head>',css+'</head>',1)
          js='<script src="odo-ui-v5.js?v=5"></script>'
          if js not in text:
              text=text.replace('</body>',js+'</body>')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4