name: Deploy ODO Fashion to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize ODO catalog scripts
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script[^>]+src=["\']dynamic-products\.js[^>]*></script>', '', text, flags=re.I)
          text=re.sub(r'<script[^>]+src=["\']product-engagement\.js(?:\?[^"\']*)?[^>]*></script>', '', text, flags=re.I)
          p.write_text(text,encoding='utf-8')
          PY
          sed -i 's#</body>#<script type="module" src="product-engagement.js?v=8"></script></body>#' index.html
      - name: Add ODO Journal public display
        shell: bash
        run: |
          set -e
          if ! grep -q 'journal.js' index.html; then
            sed -i 's#</body>#<script type="module" src="journal.js"></script></body>#' index.html
          fi
      - name: Add ODO Journal admin panel
        shell: bash
        run: |
          set -e
          if ! grep -q 'journal-admin.js' admin.html; then
            sed -i 's#</body>#<script type="module" src="journal-admin.js"></script></body>#' admin.html
          fi
      - name: Add ODO customer messaging
        shell: bash
        run: |
          set -e
          if ! grep -q 'chat.js' index.html; then
            sed -i 's#</body>#<script type="module" src="chat.js"></script></body>#' index.html
          fi
          if ! grep -q 'admin-chat.js' admin.html; then
            sed -i 's#</body>#<script type="module" src="admin-chat.js"></script></body>#' admin.html
          fi
      - name: Add unified ODO chat and AI assistant UX
        shell: bash
        run: |
          set -e
          if ! grep -q 'customer-chat-ai.js' index.html; then
            sed -i 's#</body>#<script type="module" src="customer-chat-ai.js"></script></body>#' index.html
          fi
      - name: Add Dipesh Kunwar team profile
        shell: bash
        run: |
          set -e
          if ! grep -q 'team-profile.js' index.html; then
            sed -i 's#</body>#<script type="module" src="team-profile.js"></script></body>#' index.html
          fi
      - name: Add second ODO WhatsApp customer-care number
        shell: bash
        run: |
          set -e
          if ! grep -q 'ODO_SUPPORT_2NUM_V1' script.js; then cat .github/odo-support.js >> script.js; fi
      - name: Create ODO visitor tracker
        shell: bash
        run: |
          cat > visit-tracker.js <<'EOF'
          import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
          const sb=createClient('https://gqlcxvukyezqpdftjdeo.supabase.co','sb_publishable_ViHQ2SZREPXE_GCrN_zDrw__kXoN9D8');
          (async()=>{try{const vid=localStorage.getItem('odoVisitorId')||crypto.randomUUID();localStorage.setItem('odoVisitorId',vid);const sid=sessionStorage.getItem('odoVisitSessionId')||crypto.randomUUID();sessionStorage.setItem('odoVisitSessionId',sid);const n=Number(sessionStorage.getItem('odoVisitCount')||0)+1;sessionStorage.setItem('odoVisitCount',String(n));const p=new URLSearchParams(location.search);let source=p.get('utm_source')||'';let host='';try{host=new URL(document.referrer).hostname.replace(/^www\./,'')}catch{}if(!source){if(host.includes('google.'))source='google';else if(host.includes('instagram.com'))source='instagram';else if(host.includes('facebook.com'))source='facebook';else if(host.includes('youtube.com')||host.includes('youtu.be'))source='youtube';else if(host.includes('tiktok.com'))source='tiktok';else if(host.includes('chatgpt.com')||host.includes('openai.com'))source='chatgpt';else source=host||'direct'}const browser=/Edg\//.test(navigator.userAgent)?'Edge':/Chrome\//.test(navigator.userAgent)?'Chrome':/Safari\//.test(navigator.userAgent)&&!/Chrome\//.test(navigator.userAgent)?'Safari':/Firefox\//.test(navigator.userAgent)?'Firefox':'Other';const device=innerWidth<=767?'mobile':innerWidth<=1024?'tablet':'desktop';const os=/Mac OS X/.test(navigator.userAgent)?'macOS':/Windows/.test(navigator.userAgent)?'Windows':/Android/.test(navigator.userAgent)?'Android':/iPhone|iPad|iPod/.test(navigator.userAgent)?'iOS':'Other';const landing=sessionStorage.getItem('odoLandingPath')||location.pathname;sessionStorage.setItem('odoLandingPath',landing);const {data:{user}}=await sb.auth.getUser();await sb.from('site_visits').insert({session_id:sid,visitor_id:vid,user_id:user?.id||null,page_path:location.pathname,page_title:document.title,referrer:document.referrer||'',source,medium:p.get('utm_medium')||(document.referrer?'referral':'direct'),campaign:p.get('utm_campaign')||'',landing_path:landing,device_type:device,browser,os,language:navigator.language||'',screen_width:innerWidth,screen_height:innerHeight,visit_number:n})}catch{}})();
          EOF
      - name: Create ODO visitor analytics admin panel
        shell: bash
        run: |
          cat > admin-visits.js <<'EOF'
          import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
          const sb=createClient('https://gqlcxvukyezqpdftjdeo.supabase.co','sb_publishable_ViHQ2SZREPXE_GCrN_zDrw__kXoN9D8');
          const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
          const fmt=v=>new Date(v).toLocaleString('en-NP');
          async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data:me}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).maybeSingle();if(!me?.is_admin)return;const main=document.querySelector('.odo-admin-main');if(!main||document.getElementById('odoTrafficSection'))return;const sec=document.createElement('section');sec.id='odoTrafficSection';sec.className='odo-traffic-section';sec.innerHTML='<div style="margin:45px 0"><p class="eyebrow">WEBSITE ANALYTICS</p><h2>VISITORS.</h2><div id="trafficStats" class="odo-admin-stats"></div><div class="activity-grid"><div class="activity-card"><p class="eyebrow">TRAFFIC SOURCES</p><h3>WHERE PEOPLE CAME FROM.</h3><div id="trafficSources" class="activity-list"></div></div><div class="activity-card"><p class="eyebrow">POPULAR PAGES</p><h3>WHAT PEOPLE VIEWED.</h3><div id="trafficPages" class="activity-list"></div></div><div class="activity-card"><p class="eyebrow">DEVICES</p><h3>PHONE / DESKTOP / TABLET.</h3><div id="trafficDevices" class="activity-list"></div></div><div class="activity-card"><p class="eyebrow">BROWSERS</p><h3>BROWSER MIX.</h3><div id="trafficBrowsers" class="activity-list"></div></div></div><div class="odo-admin-table-wrap"><table class="odo-admin-table"><thead><tr><th>TIME</th><th>SOURCE</th><th>REFERRER</th><th>PAGE</th><th>DEVICE</th><th>BROWSER</th><th>SESSION</th><th>VISIT #</th></tr></thead><tbody id="trafficRows"></tbody></table></div><p class="customer-note">Privacy-safe analytics: random visitor/session IDs only. No names, GPS or IP address are collected by this tracker.</p></div>';main.prepend(sec);const {data:rows,error}=await sb.from('site_visits').select('visitor_id,session_id,page_path,referrer,source,device_type,browser,visit_number,created_at').order('created_at',{ascending:false}).limit(1000);if(error){document.getElementById('trafficRows').innerHTML='<tr><td colspan="8">Run visit-tracking.sql in Supabase first.</td></tr>';return}const visits=rows||[];const unique=new Set(visits.map(v=>v.visitor_id)).size,sessions=new Set(visits.map(v=>v.session_id)).size,today=visits.filter(v=>new Date(v.created_at)>=new Date(new Date().setHours(0,0,0,0))).length;document.getElementById('trafficStats').innerHTML=[['TOTAL VISITS',visits.length],['UNIQUE VISITORS',unique],['SESSIONS',sessions],['TODAY',today],['AVG VIEWS / SESSION',sessions?(visits.length/sessions).toFixed(1):'0']].map(([k,v])=>'<div class="odo-stat"><span>'+k+'</span><strong>'+v+'</strong></div>').join('');const agg=f=>{const m={};visits.forEach(v=>{const k=v[f]||'direct';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10)};const list=(id,a)=>document.getElementById(id).innerHTML=a.length?a.map(x=>'<div class="activity-row"><strong>'+esc(x[0])+'</strong><span>'+x[1]+'</span></div>').join(''):'<div class="activity-row"><span>No data yet.</span></div>';list('trafficSources',agg('source'));list('trafficPages',agg('page_path'));list('trafficDevices',agg('device_type'));list('trafficBrowsers',agg('browser'));document.getElementById('trafficRows').innerHTML=visits.length?visits.map(v=>'<tr><td>'+fmt(v.created_at)+'</td><td>'+esc(v.source||'direct')+'</td><td>'+esc(v.referrer||'direct / none')+'</td><td>'+esc(v.page_path)+'</td><td>'+esc(v.device_type)+'</td><td>'+esc(v.browser)+'</td><td>'+esc(String(v.session_id).slice(0,10))+'…</td><td>'+esc(v.visit_number||1)+'</td></tr>').join(''):'<tr><td colspan="8">No visits yet.</td></tr>'}
          boot();
          EOF
      - name: Add website-only order confirmation flow
        shell: bash
        run: |
          set -e
          if ! grep -q 'order-fix.js' index.html; then sed -i 's#<script type="module" src="auth.js"></script>#<script type="module" src="auth.js"></script><script src="order-fix.js"></script>#' index.html; fi
      - name: Add Google sign-in button
        shell: bash
        run: |
          set -e
          if ! grep -q 'google-login.js' index.html; then sed -i 's#<script src="order-fix.js"></script>#<script src="order-fix.js"></script><script src="google-login.js"></script>#' index.html; fi
      - name: Add legal policy links
        shell: bash
        run: |
          set -e
          if ! grep -q 'policies.js' index.html; then sed -i 's#</body>#<script src="policies.js"></script></body>#' index.html; fi
      - name: Add cart back-to-shop control
        shell: bash
        run: |
          set -e
          if ! grep -q 'cart-back.js' index.html; then sed -i 's#</body>#<script src="cart-back.js"></script></body>#' index.html; fi
      - name: Add ODO visitor tracking
        shell: bash
        run: |
          set -e
          if ! grep -q 'visit-tracker.js' index.html; then sed -i 's#</body>#<script type="module" src="visit-tracker.js"></script></body>#' index.html; fi
      - name: Add visitor analytics to admin dashboard
        shell: bash
        run: |
          set -e
          if ! grep -q 'admin-visits.js' admin.html; then sed -i 's#</body>#<script type="module" src="admin-visits.js"></script></body>#' admin.html; fi
      - name: Add ODOFASHION SEO metadata
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          page=Path('index.html'); seo=Path('.github/seo-head.html').read_text(encoding='utf-8'); text=page.read_text(encoding='utf-8')
          if seo not in text: page.write_text(text.replace('</head>',seo+'</head>',1),encoding='utf-8')
          PY
      - name: Clean shared tracking parameters from visible URL
        shell: bash
        run: |
          set -e
          if ! grep -q 'clean-url.js' index.html; then sed -i 's#</body>#<script src="clean-url.js"></script></body>#' index.html; fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
