name: ODO premium design refresh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build premium About section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          img=''''''
          Path('assets').mkdir(exist_ok=True)
          Path('assets/nita-kunwar.webp').write_bytes(base64.b64decode(img))
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'class="announcement-bar"' not in s: s=s.replace('<body>','<body><div class="announcement-bar">🚚 &nbsp; CASH ON DELIVERY — ALL OVER NEPAL</div>',1)
          nita='''<section id="nita" class="section nita premium-nita"><div class="nita-visual"><div class="nita-photo"><img src="assets/nita-kunwar.webp" alt="Nita Kunwar"><div class="nita-caption"><strong>NITA KUNWAR</strong><span>ODO FASHION</span></div></div></div><div class="nita-copy"><p class="eyebrow">04 / THE VISION BEHIND ODO</p><h2>NITA<br><em>KUNWAR.</em></h2><p class="nita-role">THE NEXT CHAPTER OF ODO</p><p class="large">A new perspective behind the future of ODO Fashion.</p><p>Nita Kunwar is closely connected to the future of ODO Fashion. Her curiosity, energy and genuine interest in the brand represent the next chapter of a story that is only beginning.</p><p>The brand is being designed with care today, with a long-term vision for Nita to take an active role in growing and carrying ODO forward.</p><blockquote>“We don’t follow trends.<br>We create our own path.”</blockquote><div class="nita-pillars"><div><b>01</b><strong>MISSION</strong><span>Build a global Nepali streetwear identity.</span></div><div><b>02</b><strong>VISION</strong><span>Inspire people to see beyond the ordinary.</span></div><div><b>03</b><strong>BELIEF</strong><span>Clothing is how we express who we are.</span></div></div></div></section>'''
          s=re.sub(r'<section id="nita" class="section nita">.*?</section>',nita,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          c=Path('style.css'); old=c.read_text(encoding='utf-8')
          if 'premium-nita' not in old:
            c.write_text(old+r'''
.announcement-bar{height:34px;display:flex;align-items:center;justify-content:center;background:#0b0b0a;border-bottom:1px solid rgba(200,165,96,.22);color:#e5c982;font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:45}.premium-nita{max-width:none;display:grid;grid-template-columns:minmax(380px,.85fr) minmax(460px,1.15fr);gap:7vw;align-items:center;background:radial-gradient(circle at 20% 50%,rgba(200,165,96,.07),transparent 28%),linear-gradient(120deg,#050505,#0b0b0a)}.nita-visual{min-height:650px;display:flex;align-items:center;justify-content:center}.nita-photo{width:min(100%,580px);aspect-ratio:4/5;position:relative;overflow:hidden;border:1px solid rgba(200,165,96,.55);box-shadow:0 35px 100px rgba(0,0,0,.55);background:#111}.nita-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.72));pointer-events:none}.nita-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.04) saturate(.92)}.nita-caption{position:absolute;left:22px;right:22px;bottom:22px;padding:20px;background:rgba(5,5,5,.78);backdrop-filter:blur(18px);border:1px solid rgba(200,165,96,.28);z-index:2}.nita-caption strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:1rem;letter-spacing:.12em}.nita-caption span{display:block;color:#c8a560;font-size:.52rem;letter-spacing:.18em;margin-top:5px}.nita-copy{max-width:760px}.nita-role{color:var(--gold);font-size:.62rem;font-weight:800;letter-spacing:.2em}.nita-copy .large{font-family:'Space Grotesk',sans-serif;color:#ddd;font-size:1.55rem;line-height:1.45}.nita-copy>p:not(.eyebrow):not(.large):not(.nita-role){color:#85817a;max-width:690px;line-height:1.9}.nita-copy blockquote{margin:35px 0;padding-left:22px;border-left:2px solid var(--gold);font-family:'Space Grotesk',sans-serif;color:var(--gold2);font-size:1.45rem;line-height:1.25;font-weight:700}.nita-pillars{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:35px}.nita-pillars>div{padding:22px 16px 0;border-right:1px solid var(--line)}.nita-pillars>div:last-child{border-right:0}.nita-pillars b{display:block;color:var(--gold);font-size:.5rem;letter-spacing:.15em;margin-bottom:18px}.nita-pillars strong{display:block;font-size:.63rem;letter-spacing:.13em;margin-bottom:10px}.nita-pillars span{display:block;color:#716d66;font-size:.65rem;line-height:1.6}@media(max-width:900px){.premium-nita{grid-template-columns:1fr}.nita-visual{min-height:auto}.nita-pillars{grid-template-columns:1fr}.nita-pillars>div{border-right:0;border-bottom:1px solid var(--line);padding-bottom:18px}.nita-pillars>div:last-child{border-bottom:0}.announcement-bar{font-size:.48rem}}
''',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css assets/nita-kunwar.webp
          git diff --cached --quiet || git commit -m "Premium ODO Fashion About design with Nita profile"
          git push
